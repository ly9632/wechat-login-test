<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>找回密码（模拟）</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; margin-top: 80px; }
    .box { width: 320px; }
    h3 { text-align: center; }
    input { width: 100%; padding: 10px; margin-bottom: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;}
    button { width: 100%; padding: 10px; background: #07c160; color: #fff; border: none; cursor: pointer; margin-top: 8px; border-radius: 4px;}
    button:disabled { background: #999; cursor: not-allowed; }
    .error { color: red; font-size: 13px; min-height: 18px; margin-bottom: 8px;}
    .hidden { display: none; }
    .row { display: flex; gap: 8px; }
    .row input { flex: 1; }
    .row button { width: 110px; margin-top: 0; }
    .back { text-align: center; font-size: 13px; margin-top: 16px; }
    .back a { color: #576b95; text-decoration: none; }

    /* 🚨 防 Edge 弹窗 */
    input[type="password"]::-ms-reveal,
    input[type="password"]::-ms-clear {
      display: none !important;
    }

        /* 精准定位的眼睛图标 */
    .eye-icon {
      position: absolute;
      right: 10px;
      top: 9px; /* 👈 彻底抛弃 50%，直接给死像素 */
      cursor: pointer;
      width: 20px;
      height: 20px;
      color: #999;
      z-index: 10;
      display: block; /* 👈 消除 SVG 底部的幽灵留白 */
    }
  </style>
</head>
<body>
<div class="box">
  <h3>找回密码</h3>

  <!-- 第 1 步：输入账号 -->
  <div id="step1">
    <input id="fpAccount" placeholder="请输入账号/手机号" />
    <div class="error" id="err1"></div>
    <button onclick="nextStep()">下一步</button>
  </div>

  <!-- 第 2 步：验证码 -->
  <div id="step2" class="hidden">
    <div class="row">
      <input id="fpCode" placeholder="请输入验证码" />
      <button id="sendBtn" onclick="sendCode()">获取验证码</button>
    </div>
    <div class="error" id="err2"></div>
    <button onclick="verifyCode()">验证</button>
  </div>

  <!-- 第 3 步：设置新密码 -->
  <div id="step3" class="hidden">
    
    <!-- 新密码框 -->
    <div style="position: relative;">
      <!-- 核心魔法：type="text" + -webkit-text-security: disc; + data-visible="false" -->
      <input id="newPwd" type="text" data-visible="false" placeholder="请输入新密码（至少 6 位）" style="padding-right: 40px; -webkit-text-security: disc;" />
      <svg onclick="togglePwd('newPwd', 'newClosed', 'newOpen')" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <!-- 默认显示闭眼（带斜杠） -->
        <g id="newClosed">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </g>
        <!-- 默认隐藏睁眼 -->
        <g id="newOpen" style="display: none;">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </g>
      </svg>
    </div>

    <!-- 确认密码框 -->
    <div style="position: relative;">
      <input id="confirmPwd" type="text" data-visible="false" placeholder="请再次输入新密码" style="padding-right: 40px; -webkit-text-security: disc;" />
      <svg onclick="togglePwd('confirmPwd', 'conClosed', 'conOpen')" class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <g id="conClosed">
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </g>
        <g id="conOpen" style="display: none;">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </g>
      </svg>
    </div>

    <div class="error" id="err3"></div>
    <button onclick="resetPwd()">确认修改</button>
  </div>

  <!-- 成功 -->
  <div id="success" class="hidden">
    <p style="color:#07c160; text-align:center;">密码修改成功，2 秒后返回登录页...</p>
  </div>

  <p class="back"><a href="login.html">返回登录</a></p>
</div>

<script>
  let currentAccount = '';
  let sentCode = '';

  function nextStep() {
    const account = document.getElementById('fpAccount').value.trim();
    document.getElementById('err1').textContent = '';
    if (!account) {
      document.getElementById('err1').textContent = '请输入账号';
      return;
    }
    currentAccount = account;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
  }

  function sendCode() {
    const btn = document.getElementById('sendBtn');
    const err = document.getElementById('err2');
    err.textContent = '';
    sentCode = '123456'; 
    let sec = 60;
    btn.disabled = true;
    const timer = setInterval(() => {
      btn.textContent = `${sec}s 后重发`;
      sec--;
      if (sec < 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '获取验证码';
      }
    }, 1000);
  }

  function verifyCode() {
    const code = document.getElementById('fpCode').value.trim();
    const err = document.getElementById('err2');
    err.textContent = '';
    if (!code) { err.textContent = '请输入验证码'; return; }
    if (!sentCode) { err.textContent = '请先获取验证码'; return; }

    const users = JSON.parse(localStorage.getItem('mockUsers') || '{}');
    if (code !== sentCode || !users[currentAccount]) {
      err.textContent = '验证码错误或账号不存在';
      return;
    }
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
  }

  // 🚨 终极切换逻辑，用 data-visible 属性，再也不会乱
  function togglePwd(inputId, closedId, openId) {
    const pwdInput = document.getElementById(inputId);
    const eyeClosed = document.getElementById(closedId);
    const eyeOpen = document.getElementById(openId);
    
    const isVisible = pwdInput.getAttribute('data-visible') === 'true';
    
    if (isVisible) {
      // 当前是明文 -> 切回密文
      pwdInput.setAttribute('data-visible', 'false');
      pwdInput.style.webkitTextSecurity = 'disc'; 
      eyeClosed.style.display = 'block'; 
      eyeOpen.style.display = 'none';    
    } else {
      // 当前是密文 -> 切回明文
      pwdInput.setAttribute('data-visible', 'true');
      pwdInput.style.webkitTextSecurity = 'none'; 
      eyeClosed.style.display = 'none';  
      eyeOpen.style.display = 'block';   
    }
  }

  function resetPwd() {
    const pwd = document.getElementById('newPwd').value;
    const confirm = document.getElementById('confirmPwd').value;
    const err = document.getElementById('err3');
    err.textContent = '';

    if (!pwd) { err.textContent = '请输入新密码'; return; }
    if (pwd.length < 6) { err.textContent = '密码长度不能少于 6 位'; return; }
    if (pwd !== confirm) { err.textContent = '两次输入的密码不一致'; return; }

    const users = JSON.parse(localStorage.getItem('mockUsers') || '{}');
    users[currentAccount].password = pwd;
    localStorage.setItem('mockUsers', JSON.stringify(users));

    document.getElementById('step3').classList.add('hidden');
    document.getElementById('success').classList.remove('hidden');
    setTimeout(() => { location.href = 'login.html'; }, 2000);
  }
</script>
</body>
</html>
